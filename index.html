
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Music</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;background:#10131a;color:#f5f5f7;
  font-family:Arial,sans-serif
}
header{
  padding:22px 5%;display:flex;justify-content:space-between;
  align-items:center;border-bottom:1px solid #292e3a
}
.logo{font-size:24px;font-weight:bold;color:#a895ff}
main{max-width:1000px;margin:30px auto;padding:0 18px}
h1{font-size:28px;margin-bottom:8px}
.muted{color:#9ba3b5}
.search{display:flex;gap:10px;margin:24px 0}
input,button{
  padding:12px;border-radius:10px;border:1px solid #343b4b;
  background:#1a202b;color:white
}
input{flex:1;min-width:0}
button{cursor:pointer}
button:hover{background:#34304c}
.primary{background:#785cff;border:0}
.song{
  display:flex;align-items:center;gap:14px;padding:14px;
  border-bottom:1px solid #252b36;cursor:pointer
}
.song:hover,.song.active{background:#222238}
.number{color:#8c95a8;width:35px;flex-shrink:0}
.songname{flex:1;overflow-wrap:anywhere}
.songname small{
  display:block;color:#9ba3b5;margin-top:4px
}
.player{
  position:fixed;bottom:0;left:0;right:0;
  background:#171c26;border-top:1px solid #343b4b;
  padding:15px 5%;display:flex;align-items:center;gap:14px
}
.now{flex:1;min-width:0}
.now div{
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
audio{width:45%;max-width:500px}
.status{margin:15px 0;color:#9ba3b5}
@media(max-width:650px){
  header{padding:18px}
  header .muted{font-size:12px}
  .player{flex-wrap:wrap}
  .now{width:100%;flex:auto}
  audio{width:100%;max-width:none}
  .search{flex-wrap:wrap}
}
</style>
</head>

<body>

<header>
  <div class="logo">♫ Family Music</div>
  <span class="muted">Private family library</span>
</header>

<main>
  <h1>Your Music</h1>
  <p class="muted">A shared place for your family's favourite Gurbani and Shabad.</p>

  <div class="search">
    <input id="search" type="search" placeholder="Search Gurbani or Shabad...">
    <button onclick="loadSongs()">↻ Refresh</button>
  </div>

  <p class="status" id="status">Connecting to your music library...</p>
  <div id="list"></div>
</main>

<div class="player">
  <div class="now">
    <div id="current">Choose a song to play</div>
    <small class="muted">Family Music</small>
  </div>

  <button onclick="previous()">⏮</button>
  <button class="primary" onclick="toggle()">▶ / ⏸</button>
  <button onclick="next()">⏭</button>

  <audio id="audio" controls preload="metadata"></audio>
</div>

<script>
const API = "https://family-music-api.sharanpreetsinghbains.workers.dev";

const SONGS_API = API + "/api/songs";

let songs = [];
let current = -1;

const audio = document.getElementById("audio");
const list = document.getElementById("list");
const status = document.getElementById("status");
const search = document.getElementById("search");

// Load songs from the Cloudflare API
async function loadSongs() {
  status.textContent = "Loading your music library...";
  list.innerHTML = "";

  try {
    const response = await fetch(SONGS_API);

    if (!response.ok) {
      throw new Error("API returned status " + response.status);
    }

    const data = await response.json();

    // Supports either an array or {songs: [...], total: ...}
    const items = Array.isArray(data)
      ? data
      : (data.songs || data.results || []);

    songs = items.map(song => {
      const key = song.key || song.filename;

      // Use the API-provided URL when available
      let audioUrl = song.url;

      if (!audioUrl) {
        audioUrl = API + "/api/audio?key=" + encodeURIComponent(key);
      } else if (audioUrl.startsWith("/")) {
        audioUrl = API + audioUrl;
      }

      return {
        name: song.name || song.filename || key,
        filename: song.filename || key,
        key: key,
        url: audioUrl,
        size: song.size || 0
      };
    });

    // Keep the API's ordering
    render();

    status.textContent =
      songs.length + " songs loaded from your family music library";

  } catch (error) {
    console.error(error);

    status.textContent =
      "Could not load songs. Check the API or CORS settings.";

    list.innerHTML = `
      <p class="muted">
        ${escapeHTML(error.message)}
      </p>
      <button onclick="loadSongs()">Try Again</button>
    `;
  }
}

// Safely display text
function escapeHTML(text) {
  return String(text).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[char]));
}

// Display playlist
function render() {
  const query = search.value.toLowerCase().trim();
  list.innerHTML = "";

  const filtered = songs
    .map((song, index) => ({song, index}))
    .filter(item =>
      item.song.name.toLowerCase().includes(query) ||
      item.song.filename.toLowerCase().includes(query)
    );

  status.textContent =
    filtered.length + " of " + songs.length + " songs";

  if (!filtered.length) {
    list.innerHTML =
      '<p class="muted">No songs found.</p>';
    return;
  }

  filtered.forEach(({song, index}) => {
    const row = document.createElement("div");
    row.className = "song" + (index === current ? " active" : "");

    const number = document.createElement("span");
    number.className = "number";
    number.textContent = String(index + 1).padStart(3, "0");

    const name = document.createElement("span");
    name.className = "songname";
    name.textContent = song.name;

    const play = document.createElement("span");
    play.textContent = index === current && !audio.paused
      ? "⏸"
      : "▶";

    row.append(number, name, play);
    row.onclick = () => playSong(index);

    list.appendChild(row);
  });
}

// Play selected song
function playSong(index) {
  if (index < 0 || index >= songs.length) return;

  current = index;

  audio.src = songs[index].url;

  document.getElementById("current").textContent =
    songs[index].name;

  audio.play().catch(error => {
    console.error("Playback error:", error);
    status.textContent =
      "Unable to play this song. Check the audio API.";
  });

  render();
}

// Play or pause
function toggle() {
  if (!songs.length) return;

  if (current === -1) {
    playSong(0);
    return;
  }

  if (audio.paused) {
    audio.play();
  } else {
    audio.pause();
  }
}

// Next song
function next() {
  if (!songs.length) return;

  playSong((current + 1) % songs.length);
}

// Previous song
function previous() {
  if (!songs.length) return;

  if (audio.currentTime > 3) {
    audio.currentTime = 0;
  } else {
    playSong((current - 1 + songs.length) % songs.length);
  }
}

// Automatically play next song
audio.addEventListener("ended", next);

// Update playlist when playback changes
audio.addEventListener("play", render);
audio.addEventListener("pause", render);

// Search
search.addEventListener("input", render);

// Load music on page open
loadSongs();
</script>

</body>
</html>
